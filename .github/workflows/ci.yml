name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1 · Quality (parallel with Stage 2) ───────────────────────────────
  quality:
    name: "Stage 1 · Quality (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'push' && fromJSON('[22, 24]') || fromJSON('[22]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Covenant artifact matches the CashScript source
        run: npm run compile && git diff --exit-code src/contracts evidence/compile.json
      - name: Type check (vue-tsc)
        run: npm run typecheck
      - name: Unit + covenant VM tests with coverage
        run: npm run test:coverage
      - name: Upload coverage
        if: matrix.node == 22
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ── STAGE 2 · Security (parallel with Stage 1) ──────────────────────────────
  secrets:
    name: "Stage 2 · Secret scan (gitleaks, full history)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --log-opts="--all" --redact

  audit:
    name: "Stage 2 · Dependency audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Runtime dependencies (high and above fail the build)
        run: npm audit --omit=dev --audit-level=high
      - name: License compliance (no GPL-3.0 / AGPL-3.0 at runtime)
        run: npx --yes license-checker@25.0.1 --production --failOn "GPL-3.0;AGPL-3.0" --summary

  # ── STAGE 3 · Build ─────────────────────────────────────────────────────────
  build:
    name: "Stage 3 · Build + bundle budget"
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Production build (serverless function + app + gate)
        run: npm run build
      - name: Bundle budget (gzip JS)
        run: |
          TOTAL=0
          for f in dist/assets/*.js; do TOTAL=$((TOTAL + $(gzip -c "$f" | wc -c))); done
          KB=$((TOTAL / 1024)); echo "gzip JS total: ${KB} KB" >> "$GITHUB_STEP_SUMMARY"
          if [ "$KB" -gt 900 ]; then echo "::error::gzip JS ${KB} KB > 900 KB budget"; exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── STAGE 4 · E2E ───────────────────────────────────────────────────────────
  e2e:
    name: "Stage 4 · E2E (Playwright)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── STAGE 5 · Performance ───────────────────────────────────────────────────
  performance:
    name: "Stage 5 · Performance (Lighthouse CI)"
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Lighthouse CI (accessibility is a hard gate, the rest advisory)
        run: npx --yes @lhci/cli@0.16.1 autorun

  # ── STAGE 6 · Deploy gate ───────────────────────────────────────────────────
  deploy-gate:
    name: "Stage 6 · Deploy gate"
    needs: [quality, secrets, audit, build, e2e, performance]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: All gates passed
        run: |
          {
            echo "### All CI/CD gates passed"
            echo "- Stage 1 Quality: covenant artifact, vue-tsc, vitest + coverage"
            echo "- Stage 2 Security: gitleaks full history, npm audit, licence check"
            echo "- Stage 3 Build + bundle budget"
            echo "- Stage 4 E2E (Playwright, desktop + mobile)"
            echo "- Stage 5 Lighthouse CI"
            echo "Next: release (semantic version tag) → deploy (Vercel production, GitHub Deployment)"
          } >> "$GITHUB_STEP_SUMMARY"
