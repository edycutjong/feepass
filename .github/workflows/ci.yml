name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Covenant artifact is up to date
        run: npm run compile && git diff --exit-code src/contracts evidence/compile.json
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
