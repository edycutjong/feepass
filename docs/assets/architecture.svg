<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">FeePass: the one sponsored transaction</title>
  <desc id="d">Input 0 is the user's PUSD coin signed by the user's wallet. Input 1 is one covenant lane, spent without a signature. Output 0 sends PUSD to the recipient, output 1 returns PUSD change to the user, output 2 returns the lane to the pool plus exactly 0.01 PUSD. The miner fee is paid from the lane's BCH.</desc>
  <style>
    text{font-family:"Public Sans","Helvetica Neue",Arial,sans-serif;fill:#16202B}
    .m{font-family:"Sometype Mono",ui-monospace,Menlo,Consolas,monospace;font-size:15px}
    .h{font-weight:800;font-size:22px;letter-spacing:.02em}
    .s{font-size:15px;fill:#5E6670}
    .w{fill:#fff}.wd{fill:#B7CBEC}
    .box{fill:#FBFBF7;stroke:#16202B;stroke-width:2}
    .sign{fill:#1F4F9A}
    .ln{stroke:#16202B;stroke-width:2.5;fill:none}
    .pay{stroke:#1E9E5A;stroke-width:3.5;fill:none}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#16202B"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1E9E5A"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#EEF0EB"/>

  <!-- inputs -->
  <text x="40" y="44" class="h">INPUTS</text>
  <rect x="40" y="70" width="300" height="120" class="box"/>
  <text x="58" y="100" class="m" font-weight="700">in0 · the user's PUSD coin</text>
  <text x="58" y="126" class="s">P2PKH, no spendable BCH needed</text>
  <text x="58" y="150" class="s">signed by the user's own wallet</text>
  <text x="58" y="174" class="m">SIGHASH_ALL|FORKID|UTXOS 0x61</text>

  <rect x="40" y="240" width="300" height="120" class="box"/>
  <text x="58" y="270" class="m" font-weight="700">in1 · one pool lane</text>
  <text x="58" y="296" class="s">FeePassPool covenant UTXO</text>
  <text x="58" y="320" class="s">sponsorPaid(): no arguments, no key</text>
  <text x="58" y="344" class="s">holds BCH + PUSD; 1 of 20 lanes</text>

  <!-- the transaction -->
  <rect x="430" y="60" width="340" height="420" class="sign"/>
  <rect x="440" y="70" width="320" height="400" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="600" y="110" text-anchor="middle" class="h w">ONE TRANSACTION</text>
  <text x="600" y="140" text-anchor="middle" class="w" font-size="15">2 inputs · 3 outputs · 572 bytes</text>
  <text x="600" y="190" text-anchor="middle" class="wd" font-size="14">the covenant checks, in order</text>
  <g class="m w" font-size="14" text-anchor="start">
    <text x="470" y="222" class="w m">R1 shape: 2 in, 3 out</text>
    <text x="470" y="246" class="w m">R7 lane carries PUSD</text>
    <text x="470" y="270" class="w m">R2 in0 and out0 carry PUSD</text>
    <text x="470" y="294" class="w m">R8 out1 carries PUSD</text>
    <text x="470" y="318" class="w m">R3 out2 = same covenant</text>
    <text x="470" y="342" class="w m">R4 lane loses ≤ 2,000 sats</text>
    <text x="470" y="366" class="w m">R5 out2 PUSD = in1 + 0.01</text>
    <text x="470" y="390" class="w m">R6 extras ≤ 675 sats</text>
  </g>
  <text x="600" y="436" text-anchor="middle" class="wd" font-size="14">out0 and out1 are bound by the user's</text>
  <text x="600" y="456" text-anchor="middle" class="wd" font-size="14">signature, not by the covenant</text>

  <!-- outputs -->
  <text x="860" y="44" class="h">OUTPUTS</text>
  <rect x="860" y="70" width="300" height="100" class="box"/>
  <text x="878" y="100" class="m" font-weight="700">out0 · PUSD to recipient</text>
  <text x="878" y="126" class="s">P2PKH with tokens</text>
  <rect x="860" y="190" width="300" height="100" class="box"/>
  <text x="878" y="220" class="m" font-weight="700">out1 · PUSD change</text>
  <text x="878" y="246" class="s">back to the user</text>
  <rect x="860" y="310" width="300" height="130" class="box"/>
  <text x="878" y="340" class="m" font-weight="700">out2 · the lane returns</text>
  <text x="878" y="366" class="s">same covenant, minus the miner fee</text>
  <text x="878" y="390" class="s" font-weight="700" style="fill:#16202B">plus exactly 0.01 PUSD</text>
  <text x="878" y="414" class="s">the only fee the user pays</text>

  <!-- wires -->
  <path d="M340,130 H430" class="ln" marker-end="url(#a)"/>
  <path d="M340,300 H430" class="ln" marker-end="url(#a)"/>
  <path d="M770,120 H860" class="ln" marker-end="url(#a)"/>
  <path d="M770,240 H860" class="ln" marker-end="url(#a)"/>
  <path d="M770,375 H860" class="pay" marker-end="url(#g)"/>

  <!-- miner fee side line -->
  <path d="M600,480 V530 H980" class="ln" stroke-dasharray="8 6" marker-end="url(#a)"/>
  <text x="620" y="520" class="s">miner fee: 580 sats of lane BCH, at about 1 sat per byte</text>
  <text x="990" y="536" class="m" font-weight="700">miners</text>

  <!-- wallet link -->
  <text x="40" y="420" class="s">The browser app builds the transaction and asks the</text>
  <text x="40" y="442" class="s">user's wallet (WizardConnect) to sign input 0 only,</text>
  <text x="40" y="464" class="s">verifies it on the BCH VM, then broadcasts.</text>
  <text x="40" y="560" class="s">Bitcoin Cash mainnet only. A lane lost to a concurrent send is retried on another lane.</text>
</svg>
